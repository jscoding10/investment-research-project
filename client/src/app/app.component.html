<div class="flex h-screen flex-col bg-gray-50">
  <app-mobile-side-navigation [(open)]="isMobileMenuOpen" />
  <div class="flex min-h-0 flex-1 bg-lime-400">
    <app-side-navigation class="shrink-0" />
    <div class="flex min-w-0 flex-1 flex-col">
      <app-top-bar
        (toggleMobileMenu)="toggleMobileMenu()"
        class="shrink-0 bg-white shadow-sm" />
      <main class="flex-1 overflow-y-auto bg-gray-200">
        <router-outlet />
      </main>
      <app-footer class="shrink-0 border-t border-gray-200 bg-lime-400" />
    </div>
  </div>
</div>
