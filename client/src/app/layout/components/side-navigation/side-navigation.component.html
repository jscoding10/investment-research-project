<aside
  class="hidden h-full flex-col rounded-r-2xl border-2 border-gray-400 bg-gray-200 transition-all duration-300 lg:flex"
  [class.w-16]="!isExpanded()"
  [class.lg:w-20]="!isExpanded()"
  [class.w-56]="isExpanded()">
  <div class="p-2">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-lime-400 shadow-lg lg:h-14 lg:w-14">
      <img src="logo.png" />
    </div>
  </div>
  <div class="pt-4"></div>
  <nav class="flex-1 space-y-3 px-3 pb-6">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        class="group relative flex h-14 w-full items-center rounded-2xl transition-all duration-200 hover:bg-lime-50"
        [class.justify-center]="!isExpanded()"
        [class.justify-start]="isExpanded()"
        [class.bg-lime-50]="rla.isActive"
        [class.pl-6]="isExpanded()"
        [pTooltip]="!isExpanded() ? item.label : ''"
        tooltipPosition="right"
        tooltipStyleClass="bg-gray-900 text-white text-xs px-3 py-2 rounded-lg">
        <span
          class="material-symbols-outlined text-md xg:text-xl transition-colors"
          [class.text-lime-600]="rla.isActive"
          [class.text-gray-500]="!rla.isActive">
          {{ item.icon }}
        </span>
        @if (isExpanded()) {
          <span
            class="ml-4 flex overflow-hidden whitespace-nowrap text-center text-xs font-medium text-gray-700 transition-all">
            {{ item.label }}
          </span>
        }

        <div
          class="absolute left-0 top-1/2 h-10 w-1 -translate-y-1/2 rounded-r-full bg-lime-500 opacity-0 transition-opacity"
          [class.opacity-100]="rla.isActive"></div>
      </a>
    }
  </nav>
  <div class="px-3 pb-3">
    <button
      (click)="toggleSidebar()"
      class="group relative mx-auto flex h-full w-full items-center rounded-2xl transition-all duration-200 hover:bg-lime-50"
      [class.justify-center]="!isExpanded()"
      [class.justify-start]="isExpanded()"
      [class.pl-6]="isExpanded()"
      [pTooltip]="!isExpanded() ? (isExpanded() ? 'Close Menu' : 'Open Menu') : ''"
      tooltipPosition="right"
      tooltipStyleClass="bg-gray-900 text-white text-xs px-3 py-2 rounded-lg">
      <span class="material-symbols-outlined text-md xg:text-xl text-gray-500 transition-colors">
        {{ isExpanded() ? 'chevron_left' : 'chevron_right' }}
      </span>
      @if (isExpanded()) {
        <span class="ml-4 overflow-hidden whitespace-nowrap text-xs font-medium text-gray-700 transition-all">
          {{ isExpanded() ? 'Close Menu' : 'Open Menu' }}
        </span>
      }
      <div
        class="absolute left-0 top-1/2 h-10 w-1 -translate-y-1/2 rounded-r-full bg-lime-500 opacity-0 transition-opacity"></div>
    </button>
  </div>
</aside>
