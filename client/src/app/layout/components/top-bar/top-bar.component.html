<div class="sticky top-0 z-40 border-b border-gray-200 bg-lime-400 shadow-sm lg:px-2 lg:py-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <i class="pi pi-prime text-3xl text-lime-600 lg:hidden"></i>
      <img
        src="logo.png"
        alt="Conviction Insight Logo"
        class="mr-3 flex h-16 w-auto lg:hidden" />
      <span class="text-xl font-bold text-gray-900 lg:text-2xl">Conviction Insight</span>
    </div>
    <button
      (click)="toggleMobileMenu.emit()"
      class="rounded-lg p-2 hover:bg-gray-200 lg:hidden"
      aria-label="Open menu">
      <span class="material-symbols-outlined text-2xl text-gray-700"> menu </span>
    </button>
  </div>
</div>
